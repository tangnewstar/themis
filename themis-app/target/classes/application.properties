# Themis Rule Engine Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/themis

# Application Configuration
spring.application.name=themis-rule-engine

# Logging Configuration
logging.level.com.themis=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database Configuration (H2 in-memory for demo)
spring.datasource.url=jdbc:h2:mem:themis;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis Configuration (optional)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=2000ms

# Etcd Configuration (optional)
themis.etcd.endpoints=http://localhost:2379
themis.etcd.username=
themis.etcd.password=

# Rule Engine Configuration
themis.engine.default-execution-mode=sequential
themis.engine.max-concurrent-executions=10
themis.engine.enable-caching=true
themis.engine.cache-size=1000

# Metadata Storage Configuration
themis.metadata.storage.type=in-memory
themis.metadata.storage.auto-init=true

# AI Translation Configuration
themis.ai.enabled=true
themis.ai.confidence-threshold=0.3
themis.ai.max-candidates=5

# Management and Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true